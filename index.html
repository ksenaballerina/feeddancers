<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dance Feed</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="scripts.js"></script>
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Dance Feed</h1>
    </header>
    <main>
        <div id="post-container">
            <!-- Dynamic content will be loaded here -->
        </div>
        <button id="load-more">Load More Posts</button>
    </main>
    <footer>
        <p>&copy; 2025 FeedDancers</p>
    </footer>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const postContainer = document.getElementById('post-container');
        const loadMoreButton = document.getElementById('load-more');

        let postCount = 0;

        function fetchPosts() {
            for (let i = 0; i < 5; i++) {
                const post = document.createElement('div');
                post.classList.add('post');
                post.innerText = `Post #${++postCount}`;
                postContainer.appendChild(post);
            }
        }

        loadMoreButton.addEventListener('click', fetchPosts);

        fetchPosts(); // Initial load
    });
</script>
</html>
